spring:
  application:
    name: Events
  profiles:
    active: dev
  config:
    import:
      # Local secrets (JWT_SECRET, BREVO_API_KEY, ...) — git-ignored; see .env.example in the project root
      - optional:file:.env[.properties]
      - classpath:config/auth.yml
      - classpath:config/events.yml
      - classpath:config/scheduler.yml
      - classpath:config/analytics.yml
      - classpath:config/profile.yml
      - classpath:config/attendance.yml
      - classpath:config/email.yml
      - classpath:config/ai.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventdb?currentSchema=public}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # options: create, create-drop, update, validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        default_schema: public
        # Create the module schemas (auth, events, analytics, attendance, profile) on a fresh database;
        # ddl-auto alone only creates tables and failed on an empty database.
        hbm2ddl:
          create_namespaces: true

  sql:
    init:
      mode: always
  jackson:
    serialization:
      indent_output: true
    deserialization:
      # Jackson 3 (Boot 4) rejects a missing/null primitive by default; this code base was written for
      # Jackson 2's behavior (e.g. ProfileStudent.privacy is a primitive boolean).
      fail-on-null-for-primitives: false

logging:
  level:
    org.springframework: INFO
    com.event: DEBUG

server:
  port: ${PORT:8080}
  # Behind a load balancer / HTTPS proxy, build URLs from X-Forwarded-* headers
  forward-headers-strategy: framework

app:
  # Used in email links ("View Event Details")
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Web push (phone notifications). Off until both keys are set; generate a pair with: npx web-push generate-vapid-keys
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@campusevents.app}
  cookie:
    # Cross-site deployment (frontend and API on different domains): COOKIE_SECURE=true, COOKIE_SAME_SITE=None
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
    # Behind a frontend proxy that serves the API under a prefix (frontend/vercel.json: /api): COOKIE_PATH_PREFIX=/api
    path-prefix: ${COOKIE_PATH_PREFIX:}
