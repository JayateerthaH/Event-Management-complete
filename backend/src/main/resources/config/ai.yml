app:
  ai:
    # auto (default): Claude if ANTHROPIC_API_KEY is set, else Gemini if GEMINI_API_KEY is set.
    # Or force one: claude | gemini | none. Without a key, recommendations still work and LLM features use
    # their fallbacks.
    provider: ${AI_PROVIDER:auto}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      # Optional override (proxy / test stub); empty = Anthropic's default endpoint
      base-url: ${ANTHROPIC_BASE_URL:}
    # Claude model
    model: ${AI_MODEL:claude-opus-5-5}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      # e.g. gemini-3.8-flash (default), gemini-3.5-flash-lite (cheaper), gemini-4-argon
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      # Optional override (proxy / test stub); empty = Google's endpoint
      base-url: ${GEMINI_BASE_URL:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
