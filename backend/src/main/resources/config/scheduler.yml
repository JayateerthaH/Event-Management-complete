spring:
  application:
    name: schedular-service

  quartz:
    job-store-type: jdbc
    jdbc:
      # Idempotent copy of Quartz's script (the stock one DROPs its tables, wiping scheduled jobs)
      initialize-schema: always
      schema: classpath:db/quartz/tables_postgres.sql
    properties:
      org:
        quartz:
          threadPool:
            threadCount: 5

app:
  security:
    internal-secret: ${INTERNAL_SECRET}