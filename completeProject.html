<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusEvents Architecture</title>
<meta name="description" content="Interactive architecture, module internals, data model, build journey and interview guide for the CampusEvents platform.">
<style>
:root{
  --bg:#f6f7fb;--surface:#fff;--surface2:#eef0f7;--text:#16182a;--muted:#55597a;--border:#d9dcea;--accent:#5b34d6;--accent-soft:#ece6ff;
  --node:#ffffff;--node-text:#16182a;--edge:#6b7090;--edge-hl:#5b34d6;--active:#E69F00;--err:#D55E00;--ok:#009E73;--warn:#b25d00;
  --code:#f0f1f8;--shadow:0 6px 24px rgba(20,22,50,.10);
  --c-client:#E69F00;--c-edge:#56B4E9;--c-api:#009E73;--c-service:#0072B2;--c-async:#CC79A7;--c-data:#D55E00;--c-external:#7F7F7F;
  --s-start:#009E73;--s-process:#0072B2;--s-decision:#E69F00;--s-db:#D55E00;--s-ext:#7F7F7F;--s-error:#D55E00;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1022;--surface:#141a33;--surface2:#1b2243;--text:#e8eaf6;--muted:#a3a8c8;--border:#2b3360;--accent:#a78bfa;--accent-soft:#251e4d;
  --node:#1a2142;--node-text:#eef0ff;--edge:#8f95ba;--edge-hl:#c4b5fd;--code:#1c2448;--shadow:0 6px 24px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0c1022;--surface:#141a33;--surface2:#1b2243;--text:#e8eaf6;--muted:#a3a8c8;--border:#2b3360;--accent:#a78bfa;--accent-soft:#251e4d;
  --node:#1a2142;--node-text:#eef0ff;--edge:#8f95ba;--edge-hl:#c4b5fd;--code:#1c2448;--shadow:0 6px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--text);font:18px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
a{color:var(--accent)}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em}
code{background:var(--code);padding:.08em .35em;border-radius:5px}
h1{font-size:2.1rem;line-height:1.2;margin:.2rem 0 .6rem}
h2{font-size:1.55rem;margin:2rem 0 .8rem;line-height:1.3}
h3{font-size:1.2rem;margin:1.4rem 0 .5rem}
p{margin:.5rem 0 .9rem}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0}.skip:focus{left:8px;top:8px;z-index:99;background:var(--surface);padding:.4rem .8rem}

header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.8rem;padding:.6rem 1.2rem;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{font-weight:800;font-size:1.05rem;white-space:nowrap}
.crumbs{flex:1;min-width:0;font-size:.92rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--accent)}
.search{position:relative;width:min(380px,40vw)}
.search input{width:100%;padding:.5rem .8rem;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:16px}
.results{position:absolute;right:0;top:calc(100% + 6px);width:min(560px,92vw);max-height:65vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);display:none;z-index:50}
.results.open{display:block}
.results button{display:block;width:100%;text-align:left;background:none;border:0;padding:.5rem .8rem;cursor:pointer;border-bottom:1px solid var(--border);font-size:.92rem}
.results button[aria-selected="true"],.results button:hover{background:var(--accent-soft)}
.results small{color:var(--muted);display:block}
.iconbtn{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:.45rem .7rem;cursor:pointer;font-size:.9rem;white-space:nowrap}
.menu-btn{display:none}

.layout{display:grid;grid-template-columns:230px minmax(0,1fr)}
nav.side{position:sticky;top:57px;align-self:start;height:calc(100vh - 57px);overflow:auto;padding:1rem .7rem;border-right:1px solid var(--border);background:var(--surface)}
nav.side a{display:block;padding:.5rem .8rem;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:1rem}
nav.side a:hover{background:var(--surface2);color:var(--text)}
nav.side a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.side .sub{font-weight:500;font-size:.9rem;padding-left:1.6rem}
main{min-width:0;padding:1.6rem 2rem 5rem;max-width:1400px}

.lead{font-size:1.3rem;line-height:1.55}
.plain{font-size:1.2rem;line-height:1.55;margin:.4rem 0 1rem}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.25rem}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.stats{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:1rem 0}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:.8rem 1rem}
.stat b{display:block;font-size:1.8rem;line-height:1.1;color:var(--accent)}
.stat span{font-size:.9rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.8rem;font-weight:700;padding:.12rem .55rem;border-radius:999px;border:1px solid var(--border);background:var(--surface2);white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%}
.badge-inf{background:#fff2d6;color:#7a4b00;border-color:#f0c56c}
:root[data-theme="dark"] .badge-inf{background:#3a2c0b;color:#ffd27a;border-color:#6d5212}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge-inf{background:#3a2c0b;color:#ffd27a;border-color:#6d5212}}
.src{font-size:.85rem;color:var(--muted);margin:.3rem 0}
.src code{font-size:.8rem;word-break:break-all}
.modcard{cursor:pointer;text-decoration:none;color:inherit;display:block;transition:border-color .15s,transform .15s}
.modcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.modcard h3{margin:.2rem 0 .3rem}
details.sec{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin:1rem 0;padding:.2rem 1.2rem}
details.sec>summary{cursor:pointer;font-weight:800;font-size:1.2rem;padding:.8rem 0;list-style:none}
details.sec>summary::before{content:"▸ ";color:var(--accent)}details.sec[open]>summary::before{content:"▾ "}
details.sec>div{padding-bottom:1rem}
ul.tight{margin:.3rem 0 .8rem;padding-left:1.2rem}ul.tight li{margin:.25rem 0}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.92rem;background:var(--surface)}
th,td{text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--surface2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
.m{font-weight:800;font-size:.75rem;padding:.1rem .45rem;border-radius:6px;color:#fff;display:inline-block;min-width:3.6em;text-align:center}
.m-GET{background:#0072B2}.m-POST{background:#009E73}.m-PUT{background:#9a5a00}.m-DELETE{background:#C0392B}.m-PATCH{background:#CC79A7}
.copy{background:none;border:1px solid var(--border);border-radius:6px;padding:.05rem .4rem;cursor:pointer;font-size:.75rem;margin-left:.3rem}
.filter{padding:.45rem .7rem;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);font-size:16px;width:min(360px,100%);margin:.4rem 0 .7rem}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.tabs button{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:.35rem .9rem;cursor:pointer;font-size:.92rem}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

.diagram{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:clip}
.dhead{position:sticky;top:57px;z-index:3;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.55rem .8rem;background:var(--surface2);border-bottom:1px solid var(--border)}
.diagram svg{display:block;width:100%;height:60vh;touch-action:none;cursor:grab;user-select:none}
.diagram svg.dragging{cursor:grabbing}
.dtools{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.dtools button{background:var(--surface);border:1px solid var(--border);border-radius:8px;min-width:34px;height:34px;cursor:pointer;font-size:.9rem;padding:0 .5rem}
.player{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;flex:1 1 420px;min-width:0}
.player button{background:var(--surface);border:1px solid var(--border);border-radius:8px;height:36px;min-width:40px;cursor:pointer}
.caption{flex:1;min-width:220px;font-size:1.05rem}
.caption b{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
.legend label{display:inline-flex;align-items:center;gap:.35rem;font-size:.88rem;cursor:pointer;border:1px solid var(--border);border-radius:999px;padding:.15rem .6rem;background:var(--surface)}
.legend .sw{width:12px;height:12px;border-radius:3px}

svg .node{cursor:pointer}
svg .node text{font-size:14px;fill:var(--node-text);pointer-events:none}
svg .node text.sub{font-size:12px;fill:var(--muted)}
svg .node .shape{fill:var(--node);stroke-width:2}
svg .node:hover .shape,svg .node:focus .shape{stroke-width:3.5}
svg .node:focus{outline:none}
svg .node.dim{opacity:.28}
svg .node.active .shape{stroke:var(--active)!important;stroke-width:4.5;filter:drop-shadow(0 0 6px var(--active))}
svg .edge path{fill:none;stroke:var(--edge);stroke-width:1.6}
svg .edge.back path{stroke-dasharray:6 4}
svg .edge.hl path,svg .edge.active path{stroke:var(--edge-hl);stroke-width:2.8}
svg .edge.active path{stroke:var(--active)}
svg .edge.dim{opacity:.18}
svg .elabel rect{fill:var(--surface);stroke:var(--border)}
svg .elabel text{font-size:13px;fill:var(--muted)}
svg .boundary rect{fill:none;stroke:var(--muted);stroke-dasharray:8 6;stroke-width:1.5}
svg .boundary text{font-size:14px;fill:var(--muted);font-weight:700}
svg .cluster rect{fill:var(--surface2);stroke:var(--border)}
svg .cluster text{font-size:15px;font-weight:800;fill:var(--text)}

aside.panel{position:fixed;top:57px;right:0;bottom:0;width:min(460px,100vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .2s;z-index:40;overflow:auto;padding:1.1rem 1.3rem 3rem}
aside.panel.open{transform:none}
aside.panel .close{position:sticky;top:0;float:right}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:.5rem 1rem;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none}
.toast.show{opacity:1}
.timeline{border-left:3px solid var(--border);margin-left:.6rem;padding-left:1.4rem}
.phase{position:relative;margin:0 0 1.3rem}
.phase::before{content:"";position:absolute;left:-1.95rem;top:.6rem;width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.phase.now::before{background:var(--ok)}
.qa summary{cursor:pointer;font-weight:700;padding:.5rem 0}
.qa{border-bottom:1px solid var(--border)}
.pitch{font-size:1.25rem;line-height:1.6}
kbd{border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 .35rem;font-size:.85em;background:var(--surface2)}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.side{position:fixed;top:57px;left:0;width:260px;z-index:45;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  nav.side.open{transform:none}
  .menu-btn{display:inline-block}
  main{padding:1rem 16px 4rem}
  .crumbs{display:none}
  .search{width:auto;flex:1}
  h1{font-size:1.6rem}
  .plain,.lead{font-size:1.15rem}
}
@media print{
  header.top,nav.side,.dtools,.player,aside.panel,.filter,.legend input{display:none!important}
  .layout{display:block}main{padding:0}
  .diagram svg{height:auto;max-height:none}
  details.sec{break-inside:avoid}
  body{background:#fff;color:#000;font-size:12pt}
}
</style>
</head>

  <button class="iconbtn menu-btn" id="menuBtn" aria-label="Open navigation" aria-expanded="false">☰</button>
  <div class="brand">CampusEvents</div>
  <div class="crumbs" id="crumbs" aria-label="Breadcrumbs"></div>
  <div class="search" role="search">
    <input id="q" type="search" placeholder="Search modules, classes, endpoints, tables  ( / )" aria-label="Search" autocomplete="off" aria-controls="results" aria-expanded="false">
    <div class="results" id="results" role="listbox"></div>
  </div>
  <button class="iconbtn" id="themeBtn" aria-label="Toggle light or dark theme">◐</button>
</header>
<div class="layout">
  <nav class="side" id="side" aria-label="Sections"></nav>

</div>
<aside class="panel" id="panel" aria-label="Details" aria-hidden="true"><button class="iconbtn close" id="panelClose" aria-label="Close panel">✕ Esc</button><div id="panelBody"></div></aside>
<div class="toast" id="toast" role="status"></div>
<script>
const DATA = {"counts":{"modules":10,"endpoints":201,"entities":59,"tables":78,"javaFiles":389,"frontendFiles":111,"controllers":63,"tests":127,"testClasses":33,"journeys":26,"commits":62,"integrations":7,"schemas":7},"layers":[{"id":"client","name":"Client","color":"#E69F00"},{"id":"edge","name":"Edge / hosting","color":"#56B4E9"},{"id":"api","name":"API & cross-cutting","color":"#009E73"},{"id":"service","name":"Service modules","color":"#0072B2"},{"id":"async","name":"Background jobs","color":"#CC79A7"},{"id":"data","name":"Data","color":"#D55E00"},{"id":"external","name":"External services","color":"#7F7F7F"}],"hld":{"nodes":[{"id":"browser","label":"Browser / phone","sub":"React app + service worker","layer":"client","module":"frontend","rank":0},{"id":"crawler","label":"Link-preview crawlers","sub":"WhatsApp, LinkedIn, X…","layer":"client","rank":0},{"id":"cronjob","label":"Keep-alive pingers","sub":"GitHub Actions + cron-job.org","layer":"external","rank":0},{"id":"vercel","label":"Vercel","sub":"static app, /api proxy, crawler rewrites","layer":"edge","rank":1},{"id":"security","label":"Spring Security","sub":"CORS · JwtAuthFilter · roles","layer":"api","module":"auth","rank":2},{"id":"shared","label":"Shared","sub":"errors · migrations · ping","layer":"api","module":"shared","rank":3},{"id":"social","label":"Social & Engagement","sub":"64 files · 15 tables","layer":"service","module":"social","rank":3},{"id":"ai","label":"AI","sub":"35 files","layer":"service","module":"ai","rank":3},{"id":"auth","label":"Auth","sub":"46 files · 6 tables","layer":"service","module":"auth","rank":4},{"id":"events","label":"Events","sub":"134 files · 22 tables","layer":"service","module":"events","rank":4},{"id":"profile","label":"Profile","sub":"46 files · 8 tables","layer":"service","module":"profile","rank":4},{"id":"participation","label":"Participation","sub":"QR & attendance","layer":"service","module":"participation","rank":5},{"id":"analytics","label":"Analytics","sub":"dashboards · engagement","layer":"service","module":"analytics","rank":5},{"id":"jobs","label":"@Scheduled jobs","sub":"reminders · nudges · digest","layer":"async","module":"events","rank":5},{"id":"scheduler","label":"Quartz scheduler","sub":"JDBC job store","layer":"async","module":"scheduler","rank":5},{"id":"notification","label":"Email (Brevo client)","sub":"NotificationApi","layer":"service","module":"notification","rank":6},{"id":"db","label":"PostgreSQL (Neon)","sub":"7 schemas · 70+ tables","layer":"data","sink":true},{"id":"brevo","label":"Brevo","sub":"transactional email","layer":"external","sink":true},{"id":"cloudinary","label":"Cloudinary","sub":"event images","layer":"external","sink":true},{"id":"google","label":"Google Identity","sub":"ID token keys","layer":"external","sink":true},{"id":"llm","label":"Gemini / Claude","sub":"structured outputs","layer":"external","sink":true},{"id":"pushsvc","label":"Web Push services","sub":"FCM · Mozilla · Apple","layer":"external","sink":true}],"edges":[["browser","vercel","pages, /api/auth/*"],["crawler","vercel","user-agent rewrite"],["cronjob","security","ping"],["browser","security","REST + Bearer JWT"],["vercel","security","proxy + previews"],["security","shared",""],["security","social",""],["security","ai",""],["security","auth",""],["security","events",""],["security","profile",""],["security","participation",""],["security","analytics",""],["social","events","EventApi"],["social","profile","ProfileApi"],["social","auth","UserDirectory"],["ai","events","EventApi"],["ai","profile","ProfileApi"],["events","participation","AttendanceApi"],["events","analytics","DashboardApi"],["events","jobs",""],["security","scheduler","admin"],["participation","notification",""],["jobs","notification",""],["scheduler","notification",""],["auth","db","JPA"],["events","db","JPA"],["profile","db","JPA"],["social","db","JPA"],["participation","db","JPA"],["analytics","db","JPA"],["scheduler","db","qrtz_*"],["notification","brevo","HTTPS"],["events","cloudinary","upload"],["auth","google","verify"],["ai","llm","HTTPS"],["social","pushsvc","encrypted push"]],"deploy":[{"name":"Vercel","nodes":["vercel"]},{"name":"Render container (Docker, Spring Boot)","nodes":["security","shared","social","ai","auth","events","profile","participation","analytics","jobs","scheduler","notification"]}],"journeys":[{"id":"register","name":"Student registers for an event","steps":[["browser","The student taps Register on the event page; the app posts to POST /event/{eventId}/register with the access token."],["security","JwtAuthFilter verifies the token and loads the user; the route needs a login."],["events","RegistrationService checks duplicates, approval and seats inside RegistrationLock and a transaction."],["db","Register and UserRegistration rows are saved."],["participation","After the save, the QR ticket is created asynchronously through AttendanceApi."],["notification","The QR email goes through NotificationApi."],["brevo","Brevo delivers the email."],["social","After commit, FriendGoingListener tells friends and SavedEventNudges checks the 80% almost-full alert."],["pushsvc","Friends with push on get a phone notification."]]},{"id":"scan","name":"Organizer scans a ticket","steps":[["browser","The organizer opens the scanner; the camera reads the QR and posts POST /attendance/mark."],["security","Logged-in organizer verified."],["participation","AttendanceService checks the ticket, the scanner's rights (EventApi.canScan) and duplicates."],["db","Attendance is written and the registration marked attended."],["analytics","An 'attended' activity is recorded after commit."],["social","Badges, semester goals and later recaps count this verified check-in."]]},{"id":"approve","name":"Admin approves; followers are told","steps":[["browser","An admin clicks Review → Approve (PUT /events/admin/approve/{eventId})."],["security","@PreAuthorize requires ROLE_ADMIN."],["events","The event becomes visible and EventApprovedEvent is published."],["social","NewEventListener creates 'New from <club>' for each follower who allows it."],["db","Bell notifications are saved."],["pushsvc","Each saved notification is pushed, within quiet hours and the weekly cap."]]}]},"modules":[{"id":"auth","name":"Auth & Security","pkg":"backend/src/main/java/com/event/authmodule","layer":"api","plain":"Lets people sign up and log in (email and password, or Google), proves who is calling on every request, and decides what each role may do.","why":"Every other module trusts the identity and roles this module attaches to the request. It also owns organizer and admin onboarding, so the platform can't be used to publish events without an admin's approval.","built":["Email/password signup and login with BCrypt-hashed passwords (AuthService, SharedConfig).","Short-lived access JWT (10 minutes) plus a 7-day refresh token stored in auth.refresh_token and sent as an HttpOnly cookie.","Refresh-token rotation: each refresh token works once; the old row must be deleted (exactly one row) before a new one is issued.","Sign in with Google: the browser's Google ID token is verified server-side against Google's published keys (GoogleIdTokenVerifier).","JwtAuthFilter on every request: skips /auth/, /public/ and OAuth paths, verifies the JWT, loads the user, and puts userId and roles on the request.","URL rules in WebSecurityConfig (public GETs for event pages, stateless sessions, CORS from CORS_ALLOWED_ORIGINS) and @PreAuthorize role checks on admin endpoints.","Admin onboarding of organizers and admins (OnBoard requests, AdminController) and admin user search and overview.","RoleRecordCleanup on startup removes stale student records of promoted accounts."],"decisions":["Access token in the app, refresh token in an HttpOnly cookie: a stolen access token expires in minutes and the refresh token is never readable by JavaScript.","Cookie attributes come from configuration (app.cookie.secure, same-site, path-prefix) so the same build works on localhost and behind Vercel's /api proxy, where the cookie stays first-party (Safari blocks third-party cookies).","Rotation is enforced with a conditional delete instead of a lock: two parallel refreshes can't both succeed.","Other modules read accounts through small interfaces (OrganizerDirectory, UserDirectory) instead of the auth repositories."],"flows":["auth.login","auth.refresh","auth.filter","auth.google"],"security":["Passwords hashed with BCrypt; never returned by any endpoint.","Stateless sessions and CSRF disabled because the API authenticates with a bearer token; the refresh endpoint only accepts the HttpOnly cookie.","A token for a deleted user is rejected (JwtAuthFilter looks the user up and throws BadCredentialsException).","Google tokens are checked for signature, issuer, audience, expiry and a verified email before an account is created or used.","Role checks: @PreAuthorize(\"hasRole('ADMIN')\") on admin endpoints; organizer actions on an event additionally pass EventAccessAspect."],"failures":["Authentication failures become JSON 401s through the HandlerExceptionResolver wired into the security entry point.","Access denied becomes a JSON 403 (GlobalExceptionHandler).","An expired or reused refresh token returns 401 and the app logs the user out cleanly."],"edge":["Two browser tabs refreshing at the same moment: only one wins the delete; the frontend shares one in-flight refresh to avoid this in the first place.","Promoting a student to organizer: RoleRecordCleanup and the 'stale roles' fix (commit c6b56ac) keep role records consistent."],"tradeoffs":["Loading the user from the database on every request costs a query, but means deleted users lose access immediately.","Any logged-in account can call POST /event/organizer/create; events still stay hidden until an admin approves them."],"challenges":[["Users were logged out in production because the refresh cookie was third-party (frontend on vercel.app, API on onrender.com).","Calls to /auth/* go through Vercel's /api proxy and the cookie path gets a configurable prefix, so the cookie is first-party (commit ffac25d)."],["Parallel token refreshes raced and logged users out.","Single-use rotation on the server plus one shared in-flight refresh in the frontend (commits 1261fd7, 13dd7fa)."],["Google's popup sign-in was blocked or clunky in Chrome.","Switched to Chrome's FedCM dialog (commit b6ad45e)."]]},{"id":"events","name":"Events","pkg":"backend/src/main/java/com/event/eventmodule","layer":"service","plain":"Everything about an event: creating and approving it, its page content, registration and seats, the waitlist, saved events, feedback, certificates, images, calendar feeds, share previews and reminders.","why":"Events are the product. This is the largest module (134 files, 22 entities, 27 controllers) and it exposes EventApi so the social, AI, analytics and participation modules can use event data without touching its tables.","built":["Event creation by organizers (always unapproved at first), admin approve/reject, featured events and home-page stats.","Event page content: about, details, schedule, FAQs, speakers, highlights, what to bring, gallery and cover image (Cloudinary or local disk).","Registration with seat limits, guarded by one JVM lock (RegistrationLock) and a transaction; a QR ticket is emailed asynchronously.","Waitlist for full events, 'Can't make it? Release your seat', and automatic promotion of the next student.","Saved ('Interested') events, trending this week, social proof (interested count, organizer rating).","Feedback, organizer feedback requests, and PDF certificates rendered from an organizer's HTML template.","Collaborators who can co-manage and scan; event duplication to a new date.","Calendar subscription (.ics feed with a revocable token) and single-event calendar download.","Link previews for WhatsApp, LinkedIn and other crawlers (server-rendered meta tags).","Reminder scheduler: 1 day and 1 hour before, by email and push."],"decisions":["Clients can't set id, isApproved, isFeatured or isCompleted when creating an event; the organizer id comes from the JWT.","Attendance on a registration is forced to false on create; it gates certificates and stats.","Event cards count registrations with one grouped query (countRegistrationsByEventIds) instead of one query per event.","Trending is the same for everyone, so it is cached for 60 seconds in EventApiImpl.","ImageStorage interface with Cloudinary and local-disk implementations, picked at startup by ImageStorageConfig.","Certificates: the template is HTML with {{name}}-style placeholders; values are HTML-escaped before rendering with OpenHTMLtoPDF."],"flows":["events.register","events.release","events.lifecycle","events.complete","events.certificate","events.reminders"],"security":["@RequiresEventAccess + EventAccessAspect: only the event's creator or a collaborator (or an admin) can change its content, see its feedback, upload templates or images.","SelfOrAdmin guard on endpoints that take a user id in the path (RegistrationController, AnalyticsController).","Public reads are limited to approved events (filter, trending, similar, previews).","Uploads: certificate templates must be HTML; oversized files return 413."],"failures":["Already registered → 400; event not approved → 400; seats full → 410 Gone (the UI then offers the waitlist).","QR email failures never undo a registration (logged, seat kept).","Certificate: no attended registration → 404, no feedback → 400, no template → 404.","Text longer than its column → 400 with the field name (FieldLengthCheck)."],"edge":["maxPeople null means unlimited (previously caused a NullPointerException).","Releasing a seat after the event started, or after checking in, is refused.","A waitlisted student who already registered another way is skipped during promotion.","Approving an already approved event doesn't notify followers twice."],"tradeoffs":["The seat lock is a JVM monitor: correct for one server instance, not for several.","Reminder de-duplication is kept in memory; a restart inside a reminder window can repeat a reminder.","Some state-changing routes are GETs (GET /organizer/complete/{eventId}) for historical reasons."],"challenges":[["Overbooking risk when several students register for the last seat at once.","RegistrationLock shared by register, release and waitlist promotion, around a transactional save."],["Long event descriptions failed with 409 on older databases (varchar(255)).","TextColumnMigration widens columns to TEXT at startup; FieldLengthCheck reports 400 with the field name (commit 74e46e7)."],["Event lists were slow on the small server.","Removed an N+1 query (one count per event) and cached trending (commit 3dd1eac)."]]},{"id":"participation","name":"Participation (QR & attendance)","pkg":"backend/src/main/java/com/event/participationmodule","layer":"service","plain":"Creates each student's QR ticket, emails it, lets organizers scan it at the door, and records who actually attended.","why":"Attendance is the trust anchor of the whole platform: certificates, badges, goals, Wrapped, portfolios and leaderboards all count only QR-verified check-ins.","built":["QR ticket per registration: a random UUID encoded as a QR PNG (ZXing), saved before the email is sent.","Scan endpoint used by the organizer's camera page; checks the scanner's rights and duplicate scans.","Resend QR with a 60-second cooldown (only successful sends start the cooldown).","My tickets endpoint so the app can store tickets on the phone for offline use.","AttendanceApi for the event module: register (send QR), cancel (release seat), hasAttended."],"decisions":["The QR row is saved before emailing, so 'Resend QR' right after registering always finds it.","Resend reuses the existing code, so copies the student already has stay valid.","Marking attendance updates the event module asynchronously through EventApi, avoiding a service cycle."],"flows":["part.qr","part.scan","part.resend"],"security":["Only the event's organizer or a collaborator can mark attendance (EventApi.canScan).","A student can only resend the QR of their own registration, to the email given at registration."],"failures":["Unknown QR → 400 'Invalid QR Code'; not registered → 400; already marked → 400; wrong scanner → 403.","Resend within 60 seconds → 429 with the remaining seconds.","Email provider failure → 502 for resend; registration still kept on first send."],"edge":["Scanning the same ticket twice on the same day is refused.","Releasing a seat deletes the QR rows (AttendanceApi.cancel)."],"tradeoffs":["The resend cooldown is held in memory per server instance."],"challenges":[["'Resend QR' right after registering said 'not registered' because the email call ran first.","Save the QR rows first, then email (commit dbc3832)."]]},{"id":"analytics","name":"Analytics & Dashboards","pkg":"backend/src/main/java/com/event/analyticsmodule","layer":"service","plain":"Keeps the numbers behind the student, organizer and admin dashboards, records what people do, and computes engagement and retention metrics for admins.","why":"Students see their participation, organizers see their events' performance, and admins see whether the platform is growing and keeping people.","built":["Per-student and per-organizer dashboard rows created at signup and updated when an event is completed (DashboardApi).","Activity log (analytics.activity_event) written after commit and off the request thread (ActivityRecorder).","ActiveUserInterceptor counts a user as active on their first authenticated request of the day.","Engagement panel and retention/health metrics for admins (EngagementService, HealthMetricsService)."],"decisions":["Analytics listens to events (UserActivityEvent, EventRegisteredEvent) instead of being called by other modules, so a failure there can't break a registration.","Health metrics are SQL over existing tables, so they work for past data without new tracking."],"flows":["an.activity","an.stats"],"security":["Engagement and health endpoints are admin-only (@PreAuthorize).","Dashboard endpoints return only the caller's own data."],"failures":["Activity recording is best-effort: listener failures are logged and never reach the user."],"edge":["Metrics show a dash instead of a misleading number when there aren't enough signups yet."],"tradeoffs":["Two old tables (analytics.announcement, analytics.basic_info) still exist in the database without entities."],"challenges":[["Admin analytics were placeholders.","Real user search and working analytics (commit 94dfa20), then engagement and health metrics (e19482b, 1cf0e4a)."]]},{"id":"profile","name":"Profile & Catalogs","pkg":"backend/src/main/java/com/event/profilemodule","layer":"service","plain":"Stores each student's profile (department, year, bio, interests, preferences, social links) and the lists admins manage: badges, interests, notification types, social platforms and preferences.","why":"Interests and department drive recommendations, department counts and the leaderboard; ProfileApi gives other modules a read-only view.","built":["Student profile CRUD and social links.","Admin-managed catalogs with create, update and delete endpoints.","Interest picker shown right after signup (admin interests plus categories of approved events).","ProfileApi: interest names, department, bio and public profiles for other modules."],"decisions":["Many-to-many join tables (profile.users_interests, users_badges, users_notifications, users_preferences) keep catalogs reusable.","Other modules depend on ProfileApi, not on profile repositories."],"flows":["pr.interests","pr.catalog"],"security":["Catalog changes are admin-only.","Organizers can filter students by preference only through an organizer-only endpoint."],"failures":["Unknown ids → 404 JSON; invalid input → 400."],"edge":["New students with no interests get a one-time nudge on the dashboard (InterestNudge)."],"tradeoffs":["Admin delete actions use GET routes (/management/delete/*)."],"challenges":[["New students had no interests, so recommendations were generic.","Ask for interests right after signup (commit 2c6a3b8)."]]},{"id":"social","name":"Social & Engagement","pkg":"backend/src/main/java/com/event/socialmodule","layer":"service","plain":"Everything that brings students back: event buddies and friends, following organizers, the notification bell and phone push, badges, semester goals, portfolio, Campus Wrapped, invites, recaps, nudges, the weekly digest and the department leaderboard.","why":"Built from a retention plan: discovering events alone doesn't keep students coming back; friends, progress and timely nudges do.","built":["Event buddies: opt in per event, 'Say hi' requests (max 20 a day), accept to become friends, block and report (BuddyService).","Follow organizers; 'New from <club>' when their next event is approved (FollowService, NewEventListener).","Bell notifications (BuddyNotification, 11 types) with per-type settings (NotificationPrefsService).","Web push with the JDK only: RFC 8291 payload encryption and RFC 8292 VAPID (WebPushCrypto, PushService).","Badges earned automatically from verified attendance, feedback, certificates and friends (AchievementRules, AchievementService).","Semester goals, public portfolio at /p/:slug, Campus Wrapped per semester.","Organizer invites to past attendees (once per event), post-event recap, saved-event and feedback nudges, almost-full alerts.","Weekly digest on Mondays 9:00 IST in the bell and optionally by email, department leaderboard."],"decisions":["Every new bell notification is also a push candidate through a JPA @PostPersist listener (BellNotificationEntityListener), so no call site can forget it.","Push guardrails: at most 3 non-urgent pushes per 7 days and none between 22:00 and 08:00 IST; urgent ones (reminders, seats) always go.","All progress (badges, goals, Wrapped, leaderboard, portfolio) counts only QR-verified check-ins.","Listeners run after the transaction commits (@TransactionalEventListener) and off the request thread."],"flows":["so.buddies","so.push","so.digest","so.badges"],"security":["Blocked users can't see or contact each other; reports go to admins.","People search requires opting in ('Let others find me'); department counts appear only from 3 people up.","Portfolio is private until published; the link can be reset."],"failures":["Expired push subscriptions (404/410 from the push service) are deleted.","Digest failures for one student are logged and don't stop the others; the digest never goes twice in one week."],"edge":["A request to oneself → 400; more than 20 requests a day → 429.","Turning off 'Reminders for saved events' also stops almost-full alerts, recaps and feedback asks."],"tradeoffs":["Rate limits and guardrails are per server instance or per database row, which is fine for one instance."],"challenges":[["Push encryption without a library had to be byte-exact.","Implemented RFC 8291/8292 with the JDK and verified against Node's http_ece and web-push libraries (commit 9d3e392)."],["New notification enum values failed against Hibernate's CHECK constraint.","EnumCheckMigration drops the stale constraint at startup."]]},{"id":"ai","name":"AI","pkg":"backend/src/main/java/com/event/aimodule","layer":"service","plain":"Suggests events to each student with the reasons shown, finds events from plain-English searches, answers questions about an event using only its page, and helps organizers write descriptions, announcements and feedback summaries.","why":"AI makes discovery and organizer work faster, but the platform must work without it, so every feature has a non-AI fallback.","built":["Provider-agnostic LlmClient with Claude (Anthropic SDK) and Gemini (Interactions API) implementations and a DisabledLlmClient.","Structured outputs: responses are JSON matching Java records (JsonSchemas), so replies are always typed objects.","Recommendations and similar events from transparent scoring with a reason for every point (RecommendationScorer, SimilarEventsScorer).","Smart search: the LLM only turns the query into the existing filters; the database query is the normal one (AiSearchService).","Event Q&A answered only from the event page's facts (EventQuestionService, EventFacts).","Organizer helpers: description and FAQs, announcement drafts, feedback summaries; Plan my week."],"decisions":["Recommendations don't use the LLM at all: they are explainable, cheap and testable.","PiiRedactor removes emails and phone numbers before any text is sent to a provider.","AiRateLimiter: per-user sliding windows per feature (for example 20 searches and 20 questions a minute).","TtlCache keeps recent AI answers briefly so repeated requests don't cost again."],"flows":["ai.search","ai.recommend","ai.ask"],"security":["PII redaction before LLM calls.","Rate limits per user and feature.","The similar-events endpoint is public but uses no LLM and only approved events."],"failures":["LLM errors or timeouts fall back to keyword search or to scoring reasons; the response says whether AI was used (aiUsed)."],"edge":["Plan my week asks the LLM to pick only from candidate ids it was given."],"tradeoffs":["Content-based scoring can't learn from behaviour like collaborative filtering would; it is transparent and works from day one."],"challenges":[["One provider only (Claude).","Added Gemini behind the same interface; AI_PROVIDER or whichever key is set picks the provider (commit 5be2372)."]]},{"id":"notification","name":"Email (Notification)","pkg":"backend/src/main/java/com/event/notificationmodule","layer":"service","plain":"Sends emails through Brevo: QR tickets, reminders, digests and admin emails.","why":"One place that knows the email provider, behind NotificationApi, so the provider can change without touching other modules.","built":["BrevoEmailService implements NotificationApi with plain emails and QR attachments.","Sender address and name from configuration (PERSONAL_EMAIL, SENDER_NAME, default 'CampusEvents').","Internal admin endpoints to send an email or a QR email."],"decisions":["Provider failures become EmailDeliveryException → 502 'Email could not be sent', never a generic 500.","The digest caps emails at 250 a week, below Brevo's free 300-per-day limit."],"flows":["no.send"],"security":["The internal email endpoints are admin-only."],"failures":["RestClientException from Brevo → EmailDeliveryException → 502 JSON."],"edge":["Registration and seat changes never fail because an email failed."],"tradeoffs":["Synchronous HTTP call per email; acceptable at this scale."],"challenges":[["Emails came from 'My App'.","SENDER_NAME setting with default 'CampusEvents' (commit 3e048aa)."]]},{"id":"scheduler","name":"Scheduler (Quartz)","pkg":"backend/src/main/java/com/event/schedulermodule","layer":"async","plain":"Lets an admin schedule an email to be sent at a future time, and keeps that schedule safe across restarts.","why":"Quartz with a JDBC job store survives restarts, unlike in-memory timers.","built":["POST /schedule/email builds a Quartz job and trigger; EmailJob sends the email when it fires.","Quartz tables created from db/quartz/tables_postgres.sql (public.qrtz_*)."],"decisions":["Quartz for user-scheduled one-off jobs; Spring @Scheduled for the app's own recurring jobs (reminders, nudges, digest)."],"flows":["sc.email"],"security":["Scheduling is admin-only."],"failures":["Invalid times or payloads → 400 JSON."],"edge":["Jobs scheduled before a restart still fire afterwards."],"tradeoffs":["The recurring @Scheduled jobs are not cluster-safe; they rely on one instance."],"challenges":[["ddl-auto alone failed to create Quartz tables on an empty database.","Quartz schema script run from configuration (scheduler.yml)."]]},{"id":"shared","name":"Shared (cross-cutting)","pkg":"backend/src/main/java/com/event/sharedmodule","layer":"api","plain":"Code every module relies on: JSON error responses, events passed between modules, input length checks, startup database fixes, the self-or-admin guard and the keep-alive ping.","why":"Keeps behaviour consistent across modules: every error looks the same, and cross-module events have one shared definition.","built":["GlobalExceptionHandler maps exceptions to { error, statusCode, timeStamp } with the right status.","Shared events: UserActivityEvent, EventReminderDue, EventCompletedEvent.","FieldLengthCheck entity listener: checks every String against its column length before saving.","TextColumnMigration and EnumCheckMigration fix older schemas at startup.","SelfOrAdmin guard; PingController for keep-alive."],"decisions":["Errors never leak stack traces; unknown exceptions become 'An unexpected error occurred' (500).","Schema fixes as idempotent startup components instead of a migration tool."],"flows":["sh.errors"],"security":["SelfOrAdmin: a caller may act only on their own user id unless they are an admin."],"failures":["Malformed JSON → 400; wrong parameter type → 400; data conflicts → 409; too-long text → 400; file too large → 413."],"edge":["The ping endpoint touches no database, so Neon can still suspend."],"tradeoffs":["Without Flyway/Liquibase, schema history isn't versioned; startup components cover the known gaps."],"challenges":[["Users saw generic errors.","Show the real reason (commit 4818752) through consistent JSON errors."]]},{"id":"frontend","name":"Frontend (React app)","pkg":"frontend/src","layer":"client","plain":"The website and installable phone app: event discovery, event pages, registration, dashboards for each role, friends, settings, tickets that work offline, and phone notifications.","why":"Students mostly use phones, so the app is a PWA with offline tickets, a phone-first layout and push notifications.","built":["React 19 + Vite 7 single-page app with React Router 7; every page except Home loads on demand and likely next pages prefetch when idle.","Role-based dashboard (student, organizer, admin) with ?tab= deep links; on phones a pinned swipeable tab row.","Event page with tabs, a register modal, and a bottom action bar on phones.","AuthProvider and an axios client that attaches the JWT and shares one in-flight refresh.","Service worker: app-shell and asset caching, push and notification clicks; tickets cached in localStorage for offline use.","Settings page with switches, quick-jump chips, phone push, calendar and portfolio settings.","Playwright journeys (26) run on desktop, Android and iPhone."],"decisions":["Auth calls go through Vercel's /api proxy (first-party cookies); other API calls go straight to Render.","Crawler user agents are rewritten to server-rendered preview pages in vercel.json.","Widgets below the fold mount when scrolled near (LazyMount); event seat polling once a minute only while visible.","CSS class names avoid ad-blocker patterns (ad-*) after the admin dashboard went blank for a user."],"flows":["fe.boot","fe.push"],"security":["Protected routes redirect to login; the refresh token is never readable by JavaScript.","Role-based dashboards render only the caller's role."],"failures":["ErrorBoundary shows a crash screen instead of a blank page; failed lazy chunks reload once (not while leaving the page)."],"edge":["iPhone push only works from the Home Screen app; the UI explains this.","Offline: /tickets opens from the saved copy without network."],"tradeoffs":["JWT kept in localStorage for simplicity; mitigated by its 10-minute lifetime."],"challenges":[["WebKit crashed in tests on a second navigation after an interrupted one.","Navigate with waitUntil commit, stop reloading on preload errors while leaving a page (commit 29a71ff)."],["Dashboards lost their spacing after adding the tab fade.","The wrapper now keeps the column layout and gap (commit 3dd1eac)."]]}],"flows":{"auth.login":{"title":"Log in with email and password","module":"auth","source":["backend/src/main/java/com/event/authmodule/controller/authorization/AuthController.java","backend/src/main/java/com/event/authmodule/security/AuthService.java","backend/src/main/java/com/event/authmodule/security/AuthUtil.java"],"nodes":[["s","s","POST /auth/login"],["auth","p","AuthenticationManager.authenticate (BCrypt)"],["ok","d","Credentials valid?"],["e401","x","401 JSON error"],["jwt","p","Sign access JWT (userId, roles, 10 min)"],["rt","p","Create refresh token (7 days)"],["db","db","auth.refresh_token"],["ck","p","Set HttpOnly refresh cookie"],["end","e","200 LoginResponseDto"]],"edges":[["s","auth",""],["auth","ok",""],["ok","e401","no"],["ok","jwt","yes"],["jwt","rt",""],["rt","db","INSERT"],["rt","ck",""],["ck","end",""]],"steps":[["s","The login form posts the email and password."],["auth","Spring Security's AuthenticationManager loads the user and compares the BCrypt hash."],["ok","Wrong credentials stop here."],["e401","The security layer turns the failure into a JSON 401 through GlobalExceptionHandler."],["jwt","AuthUtil signs a short-lived access token carrying the user id and roles."],["rt","A refresh token valid for 7 days is created."],["db","It is stored in auth.refresh_token so it can be rotated and revoked."],["ck","The refresh token goes into an HttpOnly cookie whose Secure, SameSite and path come from configuration."],["end","The app receives the access token and the user's roles."]],"endpoint":"POST /auth/login"},"auth.refresh":{"title":"Refresh the session (single-use rotation)","module":"auth","source":["backend/src/main/java/com/event/authmodule/security/AuthService.java","backend/src/main/java/com/event/authmodule/security/RefreshTokenService.java"],"nodes":[["s","s","POST /auth/refresh (cookie)"],["has","d","Refresh cookie present?"],["e1","x","401 not found"],["find","p","Look up token"],["db","db","auth.refresh_token"],["exp","d","Expired?"],["e2","x","401 log in again"],["del","p","DELETE token by value"],["one","d","Exactly 1 row deleted?"],["e3","x","401 already used"],["new","p","New refresh token + acc ging anything."]}],"deploy":{"items":[["Build","backend/Dockerfile: multi-stage Maven build (eclipse-temurin:21-jdk) → slim JRE image running as a non-root user; Vite build on Vercel."],["Environment","Secrets only in environment variables (Render, Vercel, local .env ignored by git). application.yaml and config/*.yml hold ${…} placeholders."],["Containerization","JAVA_TOOL_OPTIONS tuned for small instances: MaxRAMPercentage=75, TieredStopAtLevel=1, SerialGC, Xss512k. /data volume for local uploads."],["Hosting","Frontend on Vercel (campusevents-jh.vercel.app) with rewrites in vercel.json; backend on Render (campusevents-api.onrender.com), auto-deployed on push to main."],["Database","PostgreSQL on Neon (Singapore); schema by Hibernate ddl-auto: update plus startup fix-ups (TextColumnMigration, EnumCheckMigration); Quartz tables from db/quartz/tables_postgres.sql."],["CI/CD","Push to main deploys both platforms. .github/workflows/keep-alive.yml pings the backend every 10 minutes."],["Monitoring","Application logs (INFO in prod profile), /public/ping, admin engagement and health metrics."],["Limits","Render free: a fraction of one CPU, 512 MB, sleeps after 15 minutes idle; Brevo free: 300 emails/day; Neon free compute suspends when idle."]],"notfound":["No CI pipeline that builds or runs tests (only the keep-alive workflow).","No migration tool (Flyway/Liquibase).","No APM, metrics or alerting service."]},"learnings":[{"kind":"Technical","text":"Measure before optimizing: a CPU-limited copy of the backend showed JVM warm-up and per-event queries were the real cost, not the endpoints themselves.","link":"phase:6"},{"kind":"Technical","text":"Cross-site cookies break silently on Safari; proxying auth through the frontend's own domain keeps the refresh cookie first-party.","link":"module:auth"},{"kind":"Technical","text":"Web Push needs byte-exact cryptography; testing against a reference implementation (Node's http_ece) caught mistakes unit tests wouldn't.","link":"module:social"},{"kind":"Architectural","text":"Modules that talk through small interfaces and after-commit events stayed easy to extend: 15 social features were added without touching registration code.","link":"module:events"},{"kind":"Architectural","text":"A single source of truth for 'attended' (QR scan) made every engagement feature trustworthy: badges, goals, Wrapped and portfolios can't be gamed by registering.","link":"module:participation"},{"kind":"Architectural","text":"Give AI features a deterministic fallback: the product works without a key, and recommendations stayed explainable by not using the LLM at all.","link":"module:ai"},{"kind":"Debugging","text":"'Page crashed' on iPhone tests wasn't memory: it was a WebKit assertion on a second navigation after an interrupted one, triggered by the app reloading on preload errors.","link":"module:frontend"},{"kind":"Debugging","text":"A blank admin dashboard for one user was an ad blocker hiding ad-* class names.","link":"phase:3"},{"kind":"Debugging","text":"A wait loop that searched for 'check.sh' matched its own command line and never ended: check what your process filters match.","link":"phase:6"},{"kind":"Process","text":"Every change ran the full suite (127 backend tests, lint, build, 26 journeys on 3 devices) before pushing to main.","link":"phase:5"},{"kind":"Process","text":"Screenshots at phone width found problems tests didn't: squashed buttons, overlapping bars, lost spacing.","link":"phase:6"}],"differently":["Use Flyway migrations from day one instead of ddl-auto plus startup fix-ups.","Keep reminder de-duplication and rate limits in the database (or Redis) so they survive restarts and multiple instances.","Use a database row lock (SELECT … FOR UPDATE) or an atomic seat counter instead of a JVM lock, so registration scales horizontally.","Make every state change a POST/PUT/DELETE (no GET /organizer/complete/{eventId}, no GET deletes).","Add a CI pipeline that runs the backend tests and the Playwright journeys on every pull request.","Check the organizer role on event creation instead of relying only on admin approval."],"standout":[{"t":"Verified attendance as the trust anchor","why":"Most event apps count registrations; here certificates, badges, goals, Wrapped, portfolios and the leaderboard count only QR-scanned check-ins.","ev":["backend/src/main/java/com/event/participationmodule/service/AttendanceService.java","backend/src/main/java/com/event/eventmodule/Registration/RegisterRepository.java (findEligibleCertificates)"],"tp":"Engagement features can't be gamed: only a scan at the door counts."},{"t":"Web Push implemented with the JDK only","why":"RFC 8291 encryption and RFC 8292 VAPID without a library, with guardrails (weekly cap, quiet hours) and cleanup of dead subscriptions.","ev":["backend/src/main/java/com/event/socialmodule/push/WebPushCrypto.java","backend/src/main/java/com/event/socialmodule/push/PushService.java"],"tp":"I implemented push encryption from the RFCs and verified it against a reference library."},{"t":"Single-use refresh-token rotation","why":"A conditional delete makes replayed or parallel refreshes fail safely; the frontend shares one in-flight refresh.","ev":["backend/src/main/java/com/event/authmodule/security/AuthService.java"],"tp":"A stolen refresh token can be used at most once, and races can't create two sessions."},{"t":"AI with guardrails and fallbacks","why":"Provider-agnostic client, structured outputs, PII redaction, per-feature rate limits, and a deterministic fallback for every feature.","ev":["backend/src/main/java/com/event/aimodule/llm/LlmClient.java","backend/src/main/java/com/event/aimodule/privacy/PiiRedactor.java","backend/src/main/java/com/event/aimodule/support/AiRateLimiter.java"],"tp":"AI helps, but the product never depends on it."},{"t":"Explainable recommendations","why":"Every point in the score carries a human-readable reason shown to the student; no black box.","ev":["backend/src/main/java/com/event/aimodule/recommend/RecommendationScorer.java"],"tp":"Students see why an event was suggested."},{"t":"Modular monolith with clear seams","why":"Ten modules, separate schemas, interfaces between modules and after-commit domain events.","ev":["backend/src/main/java/com/event/eventmodule/api/EventApi.java","backend/src/main/java/com/event/sharedmodule/EventCompletedEvent.java"],"tp":"Modules could be split into services later without rewriting their callers."},{"t":"Concurrency-safe seats and waitlist","why":"Register, release and waitlist promotion share one lock around a transaction; full events return 410 and offer the waitlist.","ev":["backend/src/main/java/com/event/eventmodule/Registration/RegistrationLock.java","backend/src/main/java/com/event/eventmodule/Registration/WaitlistService.java"],"tp":"The last seat can't be sold twice."},{"t":"Offline-first tickets and installable app","why":"Service worker caching plus locally stored tickets let students open their QR at the door without signal.","ev":["frontend/public/sw.js","frontend/src/pages/Tickets.jsx"],"tp":"Tickets work in the basement hall with no network."},{"t":"Tested end to end on three devices","why":"127 backend tests plus 26 Playwright journeys on desktop, Android and iPhone, run before every push.","ev":["frontend/e2e/journeys.spec.js","backend/src/test/java/com/event/security/OwnershipAuthorizationTest.java"],"tp":"78 real browser runs guard every release."},{"t":"Performance work driven by measurement","why":"Reproduced the free server's limits locally, then fixed JVM warm-up, a 189 MB unused dependency and N+1 queries.","ev":["backend/Dockerfile","backend/src/main/java/com/event/eventmodule/api/EventApiImpl.java (toCards)"],"tp":"Startup 74 s → 34 s at half a CPU, jar 330 → 125 MB."}],"interview":{"pitch":"CampusEvents is a full-stack platform for college events. Students discover events, register, get a QR ticket and check in; organizers run events; admins approve them. It's a Spring Boot modular monolith with a React PWA, deployed on Vercel, Render and Neon. What makes it different is that every engagement feature (badges, goals, portfolio, Campus Wrapped) counts only QR-verified attendance, and it has AI features with fallbacks, web push built from the RFCs, and 78 end-to-end test runs across three devices.","walkthrough":["Problem: campus events are scattered over WhatsApp groups and posters; attendance and certificates are manual.","Users: students, organizers (approved by admins) and admins. Each gets its own dashboard.","Architecture: React 19 PWA on Vercel → Spring Boot 4 API on Render → PostgreSQL on Neon. The backend is ten modules with their own schemas, talking through interfaces like EventApi and through after-commit events.","Core flow: register (seat checks under a lock) → QR ticket emailed via Brevo → organizer scans at the door → attendance unlocks feedback and a PDF certificate.","Engagement layer: buddies and friends, follows, bell plus phone push with quiet hours, badges, semester goals, portfolio, Wrapped, nudges and a weekly digest, all built on verified attendance.","AI: explainable recommendations without an LLM; LLM-backed search, Q&A and drafting with structured outputs, PII redaction, rate limits and fallbacks.","Security: 10-minute JWT plus single-use refresh rotation in an HttpOnly cookie, role checks, an ownership aspect for event actions.","Quality and ops: 127 backend tests, 26 Playwright journeys on three devices; Docker image tuned for a small instance; performance fixed by measurement."],"questions":[["How do you stop two students from taking the last seat?","Registration, seat release and waitlist promotion all run inside one shared lock (RegistrationLock) around a transactional save. The count and the insert happen inside the lock, so the last seat can't be sold twice. It's correct for one instance; for several I'd move to a row lock or an atomic counter."],["How does authentication work?","Login returns a 10-minute access JWT and sets a 7-day refresh token in an HttpOnly cookie. JwtAuthFilter verifies the JWT on each request and loads the user, so deleted accounts lose access immediately. Refresh tokens are single-use: the server deletes the presented token and only continues if exactly one row was deleted."],["Why a modular monolith instead of microservices?","One deployable on a free tier, but with real seams: separate packages and schemas, interfaces like EventApi and ProfileApi, and domain events after commit. A module could be extracted later without rewriting its callers."],["How do modules communicate without coupling?","Synchronous reads through small interfaces implemented by the owning module, and side effects through Spring application events received with @TransactionalEventListener after commit, often @Async, so a failure in social or analytics can't roll back a registration."],["How is attendance verified?","Each registration gets a random UUID QR code. Only the event's organizer or a collaborator can scan it (EventApi.canScan); duplicates are refused; the scan writes the attendance row and flag in one transaction. Certificates, badges, goals and Wrapped count only these check-ins."],["How do certificates work?","Organizers upload an HTML template with placeholders. A student needs an attended registration and submitted feedback; values are HTML-escaped and rendered to PDF with OpenHTMLtoPDF."],["What happens if the email provider is down?","Registration still succeeds: the QR rows are saved before the email, the failure is logged, and the student can resend. Resend reports 502 and doesn't start the cooldown. Errors map to EmailDeliveryException in one place."],["How do the AI features avoid hallucination and cost problems?","Recommendations don't use an LLM. Search uses the LLM only to produce structured filters for the normal query. Q&A answers only from the event page's facts and says when it can't. PII is redacted, every feature is rate-limited per user, and everything falls back when AI is unavailable."],["How did you implement web push?","With the JDK only: ECDH P-256 key agreement, HKDF and AES-GCM per RFC 8291, and an ES256 VAPID JWT per RFC 8292. Every saved bell notification is a push candidate through a JPA @PostPersist listener, filtered by a weekly cap and quiet hours. 404/410 responses delete the subscription."],["How do you handle errors consistently?","GlobalExceptionHandler maps exception types to statuses and returns { error, statusCode, timeStamp }; the security layer forwards its exceptions to the same handler. FieldLengthCheck validates text lengths before the database sees them."],["How is the frontend organized?","React 19 with lazy-loaded pages and idle prefetch, an AuthProvider, an axios client that attaches the token and shares one refresh, role-based dashboards, and a service worker for offline tickets and push. Phone layouts were checked with screenshots on three devices."],["How do you test it?","127 backend tests covering rules, security ownership, push crypto, rendering and error paths, plus 26 Playwright journeys run on desktop, Android and iPhone against a local stack before every push."],["How did you find the performance problems?","I ran the backend in a container limited like the free plan and measured startup, CPU per endpoint and per dashboard load. The causes were JVM warm-up on a tiny CPU, an unused 189 MB dependency, and one query per event in card lists. Fixes: JVM flags, removing the dependency, grouped count queries and a short trending cache."],["How do notifications avoid spamming students?","Per-type settings, a separate switch for event reminders, a weekly cap of 3 non-urgent pushes, quiet hours from 22:00 to 08:00 IST, once-only nudges, and a digest that never goes twice in a week and skips students with nothing new."],["How is the deployment set up?","Vercel serves the app and proxies auth calls so the cookie is first-party; Render runs the Docker image built by a multi-stage Dockerfile; Neon hosts PostgreSQL. Pushing to main deploys both; a GitHub Actions workflow pings the backend every 10 minutes to avoid cold starts."]],"tough":[["What would break if you ran two backend instances?","The JVM seat lock, the in-memory reminder de-duplication, QR resend cooldowns, AI rate limits and the @Scheduled jobs would all be per instance: risks of overbooking, duplicate reminders and double digests. I'd move seat checks to the database, keep de-duplication in tables or Redis, and use ShedLock or Quartz clustering for jobs."],["What are the security weaknesses?","Any logged-in account can create an event (admin approval still hides it); some state changes use GET; the access token is in localStorage, so XSS would expose it for up to 10 minutes. Fixes: role check on create, POST for state changes, and a strict Content-Security-Policy."],["Why no migration tool?","Hibernate ddl-auto with small startup fix-ups was fastest early on, but there's no versioned schema history and changes like renames aren't safe. I'd introduce Flyway with a baseline of the current schema."],["How would this scale to many colleges?","Add tenant ids, move to a paid always-on instance with several replicas behind the database-level fixes above, cache public event lists, and paginate admin lists on the server. The module boundaries make it possible to split heavy parts like notifications into their own service."],["What trade-offs did you make for the free tier?","Cold starts after sleep, a fraction of one CPU, and email limits. I tuned the JVM, added keep-alive pings, cached trending, capped emails below Brevo's limit, and moved work off the request thread. A paid instance would remove cold starts entirely."]]},"latest":["b0678c0","2026-10-19 00:22","Add completeProject.html: interactive architecture, module internals, data model, build journey and interview guide"]};

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MOD = Object.fromEntries(DATA.modules.map((m) => [m.id, m]));

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1600); }
function copy(text) {
  const done = () => toast("Copied: " + text);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  function fallback() { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("Copy failed"); } ta.remove(); }
}
function src(files) { return `<div class="src">Source: ${files.map((f) => `<code>${esc(f)}</code>`).join(" · ")}</div>`; }

/* ---------------- text measuring & wrapping ---------------- */
const CW = 7.9, SUBW = 6.9, LH = 18, SLH = 15;
function wrap(text, max) {
  const words = String(text).split(/\s+/); const lines = []; let cur = "";
  for (const w of words) { if ((cur + " " + w).trim().length > max && cur) { lines.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) lines.push(cur); return lines;
}
function measure(n) {
  const max = n.shape === "d" ? 20 : 26;
  n.lines = wrap(n.label, max); n.subl = n.sub ? wrap(n.sub, max + 6) : [];
  let w = Math.max(...n.lines.map((l) => l.length * CW), ...n.subl.map((l) => l.length * SUBW), 90) + 30;
  let h = n.lines.length * LH + n.subl.length * SLH + 22;
  if (n.shape === "d") { w = w * 1.5 + 10; h = h * 1.75 + 6; }
  if (n.shape === "db") h += 16;
  if (n.shape === "s" || n.shape === "e" || n.shape === "x") w += 16;
  n.w = Math.round(w); n.h = Math.round(h);
}

  const blob = new Blob([new XMLSerializer().serializeToString(clone)], { type: "image/svg+xml" });
  const filename = name.replace(/[^\w.-]+/g, "-").toLowerCase() + ".svg";
  saveFile(filename, blob);
}
// In the claude.ai viewer, files go through the "downloads" capability (the viewer confirms);
// opened as a local file there is no window.claude, so a normal download link is used.
const downloadsReady = window.claude && typeof window.claude.use === "function" ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null);
async function saveFile(filename, blob) {
  const dl = await downloadsReady;
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast("Saved " + filename); }
    catch (e) { toast(e && e.code === "declined" ? "Download cancelled" : e && e.code === "rate_limited" ? "Another download is waiting for confirmation" : "Download isn't available here"); }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------------- playback ---------------- */
function makePlayer(host, diagram, steps, opt = {}) {
  host.querySelector(".dhead").insertAdjacentHTML("afterbegin", `<div class="player" role="group" aria-label="Step-through playback">
    <button data-p="first" aria-label="Restart">⏮</button><button data-p="prev" aria-label="Previous step">◀</button>
    <button data-p="play" aria-label="Play">▶</button><button data-p="next" aria-label="Next step">▶|</button>
    <div class="caption" aria-live="polite"></div></div>`);
  const cap = host.querySelector(".caption"), playBtn = host.querySelector('[data-p="play"]');
  let i = -1, timer = null;
  const show = () => {
    if (i < 0) { diagram.clear(); cap.innerHTML = `<span class="muted">${esc(opt.intro || "Press ▶ to play, or use ← → to step.")}</span>`; return; }
    const [id, text] = steps[i]; diagram.activate(id, i > 0 ? steps[i - 1][0] : null, opt.dim);
    const n = diagram.L.byId.get(id); cap.innerHTML = `<b>${i + 1}/${steps.length} · ${esc(n ? n.label : id)}</b> — ${esc(text)}`;
  };
  const stop = () => { clearInterval(timer); timer = null; playBtn.textContent = "▶"; playBtn.setAttribute("aria-label", "Play"); };
  const go = (k) => { i = Math.max(-1, Math.min(steps.length - 1, k)); show(); if (i === steps.length - 1) stop(); };
  host.querySelector(".player").addEventListener("click", (ev) => {
    const a = ev.target.closest("button")?.dataset.p; if (!a) return;
    if (a === "first") { stop(); go(-1); } if (a === "prev") { stop(); go(i - 1); } if (a === "next") { stop(); go(i + 1); }
    if (a === "play") { if (timer) return stop(); if (i >= steps.length - 1) i = -1; playBtn.textContent = "⏸"; playBtn.setAttribute("aria-label", "Pause"); go(i + 1); timer = setInterval(() => go(i + 1), 2600); }
  });
  host.addEventListener("keydown", (ev) => {
    if (ev.target.closest("input")) return;
    if (ev.key === "ArrowRight") { stop(); go(i + 1); ev.preventDefault(); } if (ev.key === "ArrowLeft") { stop(); go(i - 1); ev.preventDefault(); }
  });
  show(); return { stop, go };
}

function viewData(tableId) {
  setTimeout(() => {
    const host = $("#erDiagram");
