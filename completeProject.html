    const clusterOf = (t) => (t.id.startsWith("public.") && t.m === "events" ? "events" : t.s);
    const nodes = DATA.tables.map((t) => ({ id: t.id, label: t.id.split(".")[1], sub: `${t.cols.length} cols · ${MOD[t.m].name}`, shape: t.k === "quartz" ? "db" : "p", layer: "data", cluster: clusterOf(t) }));
    const edges = DATA.tables.flatMap((t) => t.fk.map(([c, to]) => ({ from: t.id, to, label: c })));
    const clusters = [...new Set(nodes.map((n) => n.cluster))];
    const parts = clusters.map((c) => { const ns = nodes.filter((n) => n.cluster === c); const ids = new Set(ns.map((n) => n.id));
      const es = edges.filter((e) => ids.has(e.from) && ids.has(e.to)); const conn = new Set(es.flatMap((e) => [e.from, e.to]));
      const L = conn.size ? layout(ns.filter((n) => conn.has(n.id)), es, { dir: "TB" }) : null;
      const iso = ns.filter((n) => !conn.has(n.id)); iso.forEach(measure);
      return { c, L: conn.size ? L : null, iso }; });
    // pack: each cluster = connected layout on top + grid of isolated tables below (3 per row)
    const sized = parts.map((pt) => {
      const top = pt.L ? pt.L.H : 0; const cellW = Math.max(150, ...pt.iso.map((n) => n.w)) + 16, cellH = Math.max(50, ...pt.iso.map((n) => n.h)) + 14;
      const cols = Math.max(1, Math.min(3, Math.ceil(Math.sqrt(pt.iso.length)))); const rows = Math.ceil(pt.iso.length / cols);
      return { ...pt, w: Math.max(pt.L ? pt.L.W : 0, cols * cellW) + 20, h: 50 + top + rows * cellH + 10, cellW, cellH, cols, top };
    }).sort((a, b) => b.h - a.h);
    // shelf packing: rows no wider than the widest cluster or ~1.25x the container's aspect
    const maxRow = Math.max(Math.max(...sized.map((p) => p.w)), 1500);
    const placed = []; let X = 20, Y = 20, rowH = 0, W = 0;
    sized.forEach((pt) => { if (X > 20 && X + pt.w > maxRow) { X = 20; Y += rowH + 30; rowH = 0; } placed.push({ ...pt, x: X, y: Y }); X += pt.w + 30; W = Math.max(W, X); rowH = Math.max(rowH, pt.h); });
    const H = Y + rowH + 40;
    host.innerHTML = `<div class="dhead"><span class="muted" style="font-size:.9rem">Drag to pan · wheel or buttons to zoom · click a table</span><div class="dtools" role="toolbar" aria-label="Diagram controls"><button data-a="in" aria-label="Zoom in">＋</button><button data-a="out" aria-label="Zoom out">－</button><button data-a="fit" aria-label="Fit to view">Fit</button><button data-a="svg" aria-label="Download as SVG">SVG ⤓</button></div></div>`;
    const svg = el("svg", { role: "img", "aria-label": "Entity relationship diagram", viewBox: `0 0 ${W} ${H}` }); host.appendChild(svg);
    sizeSvg(svg, host, W, H);
    const defs = el("defs", {}, svg); const mk = el("marker", { id: "arrer", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs); el("path", { d: "M0,0 L10,5 L0,10 z", fill: "var(--edge)" }, mk);
    const root = el("g", {}, svg); const nodeEls = new Map(); const allNodes = [];
    placed.forEach((pt) => {
      const cg = el("g", { class: "cluster" }, root); el("rect", { x: pt.x, y: pt.y, width: pt.w, height: pt.h, rx: 16 }, cg); const t = el("text", { x: pt.x + 14, y: pt.y + 28 }, cg); t.textContent = `${pt.c} schema`;
      const add = (n, x, y) => { n.ax = x; n.ay = y; allNodes.push(n); const g = el("g", { class: "node", transform: `translate(${x},${y})`, tabindex: 0, role: "button", "aria-label": "Table " + n.id }, root); g.dataset.id = n.id;
        drawShape(g, n, `var(--c-${MOD[DATA.tables.find((tt) => tt.id === n.id).m].layer})`); nodeEls.set(n.id, g);
        const act = () => location.hash = `#/data/${encodeURIComponent(n.id)}`; g.addEventListener("click", act); g.addEventListener("keydown", (ev) => { if (ev.key === "Enter") act(); }); };
      if (pt.L) {
        const ox = pt.x + (pt.w - pt.L.W) / 2, oy = pt.y + 40;
        pt.L.edges.forEach((e) => { const g = el("g", { class: "edge" }, root); el("path", { d: e.d, transform: `translate(${ox},${oy})`, "marker-end": "url(#arrer)" }, g);
          if (e.lab) { const lg = el("g", { class: "elabel", transform: `translate(${ox},${oy})` }, root); el("rect", { x: e.lab.x - e.lab.w / 2, y: e.lab.y - 11, width: e.lab.w, height: 21, rx: 6 }, lg); const tt = el("text", { x: e.lab.x, y: e.lab.y + 4.5, "text-anchor": "middle" }, lg); tt.textContent = e.label; } });
        pt.L.nodes.forEach((n) => add(n, ox + n.x, oy + n.y));
      }
      pt.iso.forEach((n, k) => add(n, pt.x + 10 + (k % pt.cols) * pt.cellW + pt.cellW / 2, pt.y + 40 + pt.top + Math.floor(k / pt.cols) * pt.cellH + pt.cellH / 2));
    });
    let vb = { x: 0, y: 0, w: W, h: H }; const apply = () => svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    const fit = () => { const r = svg.getBoundingClientRect(); const ar = r.width / r.height; let w = W, h = H; if (w / h > ar) h = w / ar; else w = h * ar; vb = { x: (W - w) / 2, y: (H - h) / 2, w, h }; apply(); };
    const zoom = (f, cx, cy) => { const r = svg.getBoundingClientRect(); const px = cx == null ? .5 : (cx - r.left) / r.width, py = cy == null ? .5 : (cy - r.top) / r.height; const nw = Math.min(Math.max(vb.w * f, 150), W * 5), nh = nw * vb.h / vb.w; vb.x += (vb.w - nw) * px; vb.y += (vb.h - nh) * py; vb.w = nw; vb.h = nh; apply(); };
    svg.addEventListener("wheel", (ev) => { ev.preventDefault(); zoom(ev.deltaY > 0 ? 1.12 : 1 / 1.12, ev.clientX, ev.clientY); }, { passive: false });
    let drag = null; svg.addEventListener("pointerdown", (ev) => { if (ev.target.closest(".node")) return; drag = { x: ev.clientX, y: ev.clientY, vx: vb.x, vy: vb.y }; svg.setPointerCapture(ev.pointerId); });
    svg.addEventListener("pointermove", (ev) => { if (!drag) return; const r = svg.getBoundingClientRect(); vb.x = drag.vx - (ev.clientX - drag.x) * vb.w / r.width; vb.y = drag.vy - (ev.clientY - drag.y) * vb.h / r.height; apply(); });
    svg.addEventListener("pointerup", () => (drag = null));
    host.querySelector(".dtools").addEventListener("click", (ev) => { const a = ev.target.closest("button")?.dataset.a; if (a === "in") zoom(.8); if (a === "out") zoom(1.25); if (a === "fit") fit(); if (a === "svg") exportSVG(svg, { W, H }, "er-diagram"); });
    requestAnimationFrame(fit);
    bindFilter("#tblFilter", "#tblTable");
    if (tableId) { const t = DATA.tables.find((x) => x.id === tableId); if (t) { nodeEls.get(t.id)?.classList.add("active"); openPanel(tablePanel(t)); } }
  });
  return `<h1>Data model</h1><p class="lead">${DATA.counts.tables} tables in ${DATA.counts.schemas} schemas, read from the real database. Solid arrows are foreign keys; boxes are coloured by their owning module's layer and grouped by schema. Click a table for its columns, keys and logical references.</p>
  <div class="diagram" id="erDiagram" aria-label="ER diagram"></div>
  ${src(["backend/src/main/java/com/event/**/entity*", "backend/src/main/resources/db/quartz/tables_postgres.sql"])}
  <p class="muted">Most cross-module references (user_id, event_id…) are plain columns without foreign keys, so modules stay independent. They are listed per table as <span class="chip badge-inf">Inferred</span> logical references.</p>
  <h2>All tables</h2><input class="filter" id="tblFilter" placeholder="Filter tables or columns" aria-label="Filter tables">
  <div class="tablewrap"><table id="tblTable"><tr><th>Table</th><th>Owner</th><th>Entity</th><th>Columns</th></tr>
  ${DATA.tables.map((t) => `<tr><td><a href="#/data/${encodeURIComponent(t.id)}"><code>${esc(t.id)}</code></a></td><td><a href="#/modules/${t.m}">${esc(MOD[t.m].name)}</a></td><td>${t.e ? `<code>${esc(t.e)}</code>` : `<span class="chip">${t.k}</span>`}</td><td style="font-size:.85rem">${t.cols.map((c) => esc(c[0])).join(", ")}</td></tr>`).join("")}</table></div>`;
}
function tablePanel(t) {
  return `<h2 style="margin-top:0"><code>${esc(t.id)}</code></h2><p>Owned by <a href="#/modules/${t.m}">${esc(MOD[t.m].name)}</a>${t.e ? ` · entity <code>${esc(t.e)}</code>` : ""} ${t.k === "legacy" ? `<span class="chip">no entity in code (legacy table)</span>` : t.k === "join" ? `<span class="chip">join table</span>` : ""}</p>
  ${t.f ? src([t.f]) : ""}
  <div class="tablewrap"><table><tr><th>Column</th><th>Type</th><th>Key</th></tr>${t.cols.map(([c, ty]) => `<tr><td><code>${esc(c)}</code></td><td>${esc(ty)}</td><td>${t.pk.includes(c) ? "PK" : ""}${t.fk.filter((f) => f[0] === c).map((f) => `FK → <a href="#/data/${encodeURIComponent(f[1])}">${esc(f[1])}</a>`).join("")}</td></tr>`).join("")}</table></div>
  ${t.lg.length ? `<h3>Logical references <span class="chip badge-inf">Inferred</span></h3><p class="muted">No foreign key in the schema; inferred from the column name.</p>${list(t.lg.map(([c, to]) => `${c} → ${to}`))}` : ""}`;
}

function viewJourney() {
  const ph = DATA.phases;
  return `<h1>Build journey</h1><p class="lead">From the first commit to today, derived from ${DATA.counts.commits} commits. Each phase lists what shipped, the tech introduced, problems solved and decisions made.</p>
  <div class="timeline">${ph.map((p, i) => `<div class="phase" id="phase-${i}"><div class="card"><span class="chip">Phase ${i}</span> <span class="muted">${esc(p.period)}</span><h2 style="margin:.4rem 0">${esc(p.name)}</h2>
    <p><b>Goal:</b> ${esc(p.goal)}</p><h3>Shipped</h3>${list(p.shipped)}${p.tech.length ? `<h3>Tech introduced</h3>${list(p.tech)}` : ""}${p.problems.length ? `<h3>Problems solved</h3>${list(p.problems)}` : ""}${p.decisions.length ? `<h3>Decisions</h3>${list(p.decisions)}` : ""}
    <details><summary class="muted" style="cursor:pointer">${p.commits.length} commit${p.commits.length === 1 ? "" : "s"}</summary><div class="tablewrap"><table>${p.commits.map(([h, d, s]) => `<tr><td><code>${esc(h)}</code></td><td style="white-space:nowrap">${esc(d)}</td><td>${esc(s)}</td></tr>`).join("")}</table></div></details></div></div>`).join("")}
   <div class="phase"><div class="card"><span class="chip">Deployment</span><h2 style="margin:.4rem 0">Deployment and operations</h2>
    <div class="tablewrap"><table>${DATA.deploy.items.map(([k, v]) => `<tr><th style="position:static">${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</table></div>
    <p><b>Not found in code:</b></p>${list(DATA.deploy.notfound)}${src(["backend/Dockerfile", "frontend/vercel.json", ".github/workflows/keep-alive.yml", "backend/src/main/resources/application.yaml"])}</div></div>
   <div class="phase now"><div class="card"><span class="chip" style="color:var(--ok)">● Now</span><h2 style="margin:.4rem 0">Now and next</h2>
    <p><b>Now:</b> live on Vercel, Render and Neon; latest commit <code>${esc(DATA.latest[0])}</code> (${esc(DATA.latest[1])}): ${esc(DATA.latest[2])}.</p>
    <p><b>Next:</b></p>${list(DATA.differently)}</div></div></div>`;
}
function linkFor(l) { const [k, v] = l.split(":"); return k === "module" ? `<a href="#/modules/${v}">${esc(MOD[v].name)}</a>` : `<a href="#/journey" data-phase="${v}">Phase ${v}: ${esc(DATA.phases[+v].name)}</a>`; }
function viewLearnings() {
  const kinds = [...new Set(DATA.learnings.map((l) => l.kind))];
  return `<h1>Learnings</h1>${kinds.map((k) => `<h2>${esc(k)}</h2><div class="grid">${DATA.learnings.filter((l) => l.kind === k).map((l) => `<div class="card"><p style="font-size:1.05rem">${esc(l.text)}</p><small>From: ${linkFor(l.link)}</small></div>`).join("")}</div>`).join("")}
  <h2>What I would do differently</h2>${list(DATA.differently)}`;
}
function viewStandout() {
  return `<h1>What sets this project apart</h1><p class="lead">Compared with typical college event apps (CRUD over events and registrations), these are the parts with real engineering depth. Each links to the code that proves it.</p>
  <div class="grid">${DATA.standout.map((s) => `<div class="card"><h3 style="margin-top:0">${esc(s.t)}</h3><p>${esc(s.why)}</p><p><b>Talking point:</b> “${esc(s.tp)}” <button class="copy" data-copy="${esc(s.tp)}">copy</button></p>${src(s.ev)}</div>`).join("")}</div>`;
}
function viewInterview() {
  const I = DATA.interview;
  return `<h1>Interview mode</h1>
  <h2>30-second pitch <button class="copy" data-copy="${esc(I.pitch)}">copy</button></h2><p class="pitch card">${esc(I.pitch)}</p>
  <h2>2-minute walkthrough</h2><ol>${I.walkthrough.map((w) => `<li style="margin:.35rem 0">${esc(w)}</li>`).join("")}</ol>
  <h2>15 likely questions</h2>${I.questions.map(([q, a], i) => `<details class="qa"><summary>${i + 1}. ${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}
  <h2>5 tough questions</h2>${I.tough.map(([q, a], i) => `<details class="qa"><summary>${i + 1}. ${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}
  <p class="muted" style="margin-top:1rem"><button class="iconbtn" id="openAll">Expand all answers</button></p>`;
}

/* ---------------- search ---------------- */
const INDEX = [
  ...DATA.modules.map((m) => ({ t: m.name, s: "Module · " + m.plain, h: `#/modules/${m.id}` })),
  ...Object.entries(DATA.flows).map(([id, f]) => ({ t: f.title, s: "Flow · " + MOD[f.module].name, h: `#/modules/${f.module}/flow/${id}` })),
  ...DATA.classes.map((c) => ({ t: c[1], s: `Class (${c[2]}) · ${c[3].replace("backend/src/main/java/com/event/", "")}`, h: `#/modules/${c[0]}?q=cls:${c[1]}` })),
  ...DATA.endpoints.map((e) => ({ t: `${e[1]} ${e[2]}`, s: `Endpoint · ${e[3]} · ${e[7]}`, h: `#/modules/${e[0]}?q=ep:${e[2]}` })),
  ...DATA.tables.map((t) => ({ t: t.id, s: `Table · ${MOD[t.m].name}${t.e ? " · " + t.e : ""}`, h: `#/data/${encodeURIComponent(t.id)}` })),
  ...DATA.frontend.map((f) => ({ t: f[0].split("/").pop(), s: "Frontend · " + f[0], h: `#/modules/frontend?q=cls:${f[0].split("/").pop()}` })),
];
const qEl = $("#q"), rEl = $("#results"); let sel = 0, hits = [];
function runSearch() {
  const v = qEl.value.trim().toLowerCase(); if (v.length < 2) { rEl.classList.remove("open"); qEl.setAttribute("aria-expanded", "false"); return; }
  hits = INDEX.map((x) => { const t = x.t.toLowerCase(); const sc = t === v ? 0 : t.startsWith(v) ? 1 : t.includes(v) ? 2 : x.s.toLowerCase().includes(v) ? 3 : 9; return [sc, x]; }).filter((h) => h[0] < 9).sort((a, b) => a[0] - b[0]).slice(0, 30).map((h) => h[1]);
  sel = 0; rEl.innerHTML = hits.length ? hits.map((h, i) => `<button role="option" aria-selected="${i === 0}" data-h="${esc(h.h)}">${esc(h.t)}<small>${esc(h.s.slice(0, 140))}</small></button>`).join("") : `<button disabled>No results</button>`;
  rEl.classList.add("open"); qEl.setAttribute("aria-expanded", "true");
}
qEl.addEventListener("input", runSearch);
qEl.addEventListener("keydown", (ev) => {
  const bs = [...rEl.querySelectorAll("button[data-h]")]; if (!bs.length) return;
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { ev.preventDefault(); sel = (sel + (ev.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length; bs.forEach((b, i) => b.setAttribute("aria-selected", i === sel)); bs[sel].scrollIntoView({ block: "nearest" }); }
  if (ev.key === "Enter") { ev.preventDefault(); location.hash = bs[sel].dataset.h; closeSearch(); }
});
rEl.addEventListener("click", (ev) => { const b = ev.target.closest("button[data-h]"); if (b) { location.hash = b.dataset.h; closeSearch(); } });
function closeSearch() { rEl.classList.remove("open"); qEl.setAttribute("aria-expanded", "false"); }
document.addEventListener("click", (ev) => { if (!ev.target.closest(".search")) closeSearch(); });

/* ---------------- router ---------------- */
function crumbs(parts) { $("#crumbs").innerHTML = parts.map(([t, h], i) => (i < parts.length - 1 ? `<a href="${h}">${esc(t)}</a>` : `<span>${esc(t)}</span>`)).join(" › "); }
function route() {
  cleanup.forEach((f) => f()); cleanup = []; closePanel();
  const raw = location.hash.replace(/^#\/?/, ""); const [path, query] = raw.split("?"); const seg = path.split("/").map(decodeURIComponent);
  const q = query ? new URLSearchParams(query).get("q") : null;
  const sec = SECTIONS.some(([s]) => s === seg[0]) ? seg[0] : "overview";
  let html = ""; const c = [["Overview", "#/overview"]];
  if (sec === "overview") html = viewOverview();
  if (sec === "hld") { html = viewHLD(seg[1]); c.push(["HLD", "#/hld"]); }
  if (sec === "modules") { c.push(["Modules", "#/modules"]); if (seg[1] && MOD[seg[1]]) { c.push([MOD[seg[1]].name, `#/modules/${seg[1]}`]); if (seg[2] === "flow" && DATA.flows[seg[3]]) c.push([DATA.flows[seg[3]].title, location.hash]); html = viewModule(seg[1], seg[2] === "flow" ? seg[3] : null, q); } else html = viewModules(); }
  if (sec === "data") { c.push(["Data", "#/data"]); if (seg[1]) c.push([seg[1], location.hash]); html = viewData(seg[1]); }
  if (sec === "journey") { html = viewJourney(); c.push(["Journey", "#/journey"]); }
  if (sec === "learnings") { html = viewLearnings(); c.push(["Learnings", "#/learnings"]); }
  if (sec === "standout") { html = viewStandout(); c.push(["Standout", "#/standout"]); }
  if (sec === "interview") { html = viewInterview(); c.push(["Interview", "#/interview"]); }
  if (sec === "overview") c.length = 1;
  $("#view").innerHTML = html; crumbs(c);
  document.querySelectorAll("nav.side a").forEach((a) => a.setAttribute("aria-current", a.dataset.s === sec ? "page" : "false"));
  $("#side").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false");
  if (!(sec === "modules" && seg[2] === "flow") && !q) window.scrollTo(0, 0);
  document.title = (c.length > 1 ? c[c.length - 1][0] + " · " : "") + "CampusEvents Architecture";
}
$("#side").innerHTML = SECTIONS.map(([s, t]) => `<a href="#/${s}" data-s="${s}">${t}</a>${s === "modules" ? DATA.modules.map((m) => `<a class="sub" href="#/modules/${m.id}" data-s="x">${esc(m.name)}</a>`).join("") : ""}`).join("");
window.addEventListener("hashchange", route);
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-copy]"); if (b) copy(b.dataset.copy);
  if (ev.target.id === "openAll") document.querySelectorAll("details.qa").forEach((d) => (d.open = true));
  const ph = ev.target.closest("[data-phase]"); if (ph) setTimeout(() => document.getElementById("phase-" + ph.dataset.phase)?.scrollIntoView({ block: "start" }), 60);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") { closePanel(); closeSearch(); $("#side").classList.remove("open"); }
  if (ev.key === "/" && !ev.target.closest("input,textarea")) { ev.preventDefault(); qEl.focus(); }
});
$("#menuBtn").addEventListener("click", () => { const o = $("#side").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", o); });
$("#themeBtn").addEventListener("click", () => {
  const r = document.documentElement; const cur = r.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark"; r.setAttribute("data-theme", next); try { localStorage.setItem("ce-arch-theme", next); } catch (e) {}
});
try { const t = localStorage.getItem("ce-arch-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
window.addEventListener("beforeprint", () => document.querySelectorAll("details").forEach((d) => (d.open = true)));
window.addEventListener("resize", () => document.querySelectorAll(".dtools [data-a='fit']").forEach((b) => b.click()));
route();
</script>
