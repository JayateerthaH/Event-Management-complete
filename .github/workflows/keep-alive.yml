# Render's free plan puts the backend to sleep after 15 minutes without traffic, and waking it takes ~2.5 minutes.
# This pings it every 10 minutes. "/" is answered by the security layer (401) without touching the database,
# so Neon's free compute can still suspend. GitHub disables scheduled workflows after 60 days with no repo activity;
# re-enable it under Actions if that happens.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend
        run: |
          code=$(curl -s -o /dev/null -m 180 -w '%{http_code}' https://campusevents-api.onrender.com/ || true)
          echo "Backend answered HTTP $code"
